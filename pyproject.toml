[project]
name = "wrodle"
version = "0.1.0"
description = "A Wordle clone, created for my portfolio."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.0",
    "uvicorn>=0.53.0",
]
license = { text = "MIT" }

[dependency-groups]
dev = [
    "commitizen>=4.18.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:project.version"]
tag_format = "v$version"
update_changelog_on_bump = true
annotated_tag = true
bump_message = "release: bump version to $new_version"
changelog_file = "CHANGELOG.md"
changelog_incremental = true

[tool.ruff]
line-length = 88
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
strict = true
cache_dir = ".cache/mypy"
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"
]
