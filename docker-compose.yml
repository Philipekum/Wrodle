name: Wrodle

services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
  
  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
